[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castgate"
version = "0.1.0"
description = "CaStGate illumination-reliability CNN/Transformer fusion"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "timm>=1.0,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
castgate = "castgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
